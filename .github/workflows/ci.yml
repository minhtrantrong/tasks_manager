name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  package:
    name: package (ubuntu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/pkgvenv
          /tmp/pkgvenv/bin/pip install dist/*.whl
          /tmp/pkgvenv/bin/task-manager --help
          /tmp/pkgvenv/bin/python -m task_manager --help
