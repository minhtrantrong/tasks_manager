name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q

  write-path-lint:
    name: write-path lint (N7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: One write path is mechanically enforced
        run: pytest -q tests/test_write_path_lint.py

  acceptance:
    name: acceptance gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,dashboard]"
      - name: A-D
        run: pytest -q -k "cold_resume or no_double_work or bounded_memory or one_write_path"

  package:
    name: package (ubuntu)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Assert the wheel ships every package-data file
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = (
              "task_manager/workflows/simple.md",
              "task_manager/migrations/0001_initial.sql",
              "task_manager/dashboard/templates/base.html",
              "task_manager/dashboard/templates/board.html",
              "task_manager/dashboard/static/app.css",
              "task_manager/dashboard/static/htmx.min.js",
          )
          missing = [s for s in required if not any(n.endswith(s) for n in names)]
          if missing:
              sys.exit(f"missing package data: {missing}")
          if any("__pycache__" in n for n in names):
              sys.exit("wheel contains __pycache__")
          print("package data complete:", len(names), "entries")
          PY
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/pkgvenv
          /tmp/pkgvenv/bin/pip install dist/*.whl
          /tmp/pkgvenv/bin/task-manager --help
          /tmp/pkgvenv/bin/python -m task_manager --help
          /tmp/pkgvenv/bin/python -c "import task_manager; print(task_manager.__version__)"
