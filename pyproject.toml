[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-manager"
version = "0.1.0"
description = "A local-first MCP server that gives agents a durable, dependency-aware task graph plus a reasoning journal."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tasks Manager contributors" }]
license = { text = "MIT" }
keywords = ["mcp", "tasks", "kanban", "sqlite", "agent", "journal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Software Development :: Bug Tracking",
  "Environment :: Console",
]
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]
dashboard = ["fastapi>=0.115", "jinja2>=3.1", "uvicorn>=0.30"]

[project.scripts]
task-manager = "task_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/task_manager"]
include = [
  "src/task_manager/**/*.py",
  "src/task_manager/workflows/*.md",
  "src/task_manager/migrations/*.sql",
  "src/task_manager/dashboard/templates/**/*.html",
  "src/task_manager/dashboard/static/**",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
